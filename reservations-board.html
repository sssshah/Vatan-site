<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C1008">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Today's Reservations — Vatan</title>
<link rel="manifest" href="/reservation-board.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/images/reservation-board-icon-192.png">
<link rel="apple-touch-icon" href="/images/reservation-board-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --saffron:#C8660A; --saffron-light:#E8820F; --maroon:#7A1C2E; --maroon-deep:#5A1020;
  --gold:#D4A853; --gold-light:#F0C878; --ivory:#FDF6E9; --ivory-dark:#F5EDD8;
  --dark:#1C1008; --dark-mid:#2E1A0E;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'DM Sans',sans-serif;
  background:radial-gradient(ellipse at top, var(--dark-mid) 0%, var(--dark) 60%);
  color:var(--ivory);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.4rem 2.5rem;
  border-bottom:1px solid rgba(212,168,83,0.28);
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:0.9rem;}
.brand img{height:48px;}
.brand-text h1{
  font-family:'Cormorant Garamond',serif;
  font-size:1.6rem;
  font-weight:700;
  letter-spacing:0.02em;
}
.brand-text p{
  font-size:0.72rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--gold);
  margin-top:0.15rem;
}
.header-right{text-align:right;}
#clock{
  font-size:1.6rem;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
#dateLine{
  font-size:0.78rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:rgba(253,246,233,0.6);
  margin-top:0.2rem;
}

.board-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:0.7rem 2.5rem;
  border-bottom:1px solid rgba(212,168,83,0.18);
  background:rgba(0,0,0,0.12);
  flex-shrink:0;
}
.location-filters{display:flex;align-items:center;gap:0.45rem;}
.filter-label{margin-right:0.2rem;font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(253,246,233,0.5);}
.filter-btn{min-width:2.8rem;padding:0.38rem 0.75rem;border:1px solid rgba(212,168,83,0.3);border-radius:999px;color:rgba(253,246,233,0.7);font-size:0.7rem;font-weight:700;letter-spacing:0.06em;text-align:center;text-decoration:none;transition:all 0.2s;}
.filter-btn:hover{border-color:var(--gold);color:var(--gold-light);}
.filter-btn.active{border-color:var(--gold);background:var(--gold);color:var(--dark);box-shadow:0 0 14px rgba(212,168,83,0.2);}
.sort-note{font-size:0.64rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(253,246,233,0.42);white-space:nowrap;}
.date-group{display:flex;align-items:center;gap:0.45rem;}
.date-label{font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(253,246,233,0.5);}
#boardDate{background:rgba(0,0,0,0.25);border:1px solid rgba(212,168,83,0.3);border-radius:999px;color:var(--ivory);font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;padding:0.38rem 0.75rem;color-scheme:dark;}
#boardDate:focus{outline:none;border-color:var(--gold);}
.coverage-note{display:none;font-size:0.72rem;letter-spacing:0.04em;color:rgba(253,246,233,0.55);padding:0.5rem 0.2rem 0;}
.coverage-note.show{display:block;}
.dismissed-bar{display:none;width:100%;margin-top:0.8rem;padding:0.7rem 1.2rem;border:1px dashed rgba(212,168,83,0.4);border-radius:10px;background:transparent;color:var(--gold-light);font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;}
.dismissed-bar.show{display:block;}
.board-row.done{opacity:0.6;}
.board-row.done .row-name{text-decoration:line-through;}
.row-check{width:1.5rem;height:1.5rem;accent-color:var(--gold);cursor:pointer;justify-self:center;}
.row-dismiss{width:1.9rem;height:1.9rem;border-radius:999px;border:1px solid rgba(212,168,83,0.35);background:transparent;color:rgba(253,246,233,0.6);font-size:0.95rem;line-height:1;cursor:pointer;justify-self:center;}
.row-dismiss:hover{border-color:var(--gold);color:var(--gold-light);}

main{flex:1;min-height:0;overflow:hidden;padding:1.5rem 2.5rem 2rem;display:flex;flex-direction:column;}

#boardWrap{
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.board-cols{
  display:grid;
  grid-template-columns:2.4rem 0.9fr 0.8fr 2fr 0.8fr 2.4rem;
  padding:0.9rem 1.5rem;
  font-size:0.78rem;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--gold);
  border-bottom:2px solid rgba(212,168,83,0.35);
  flex-shrink:0;
}

.board-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.board-row{
  display:grid;
  grid-template-columns:2.4rem 0.9fr 0.8fr 2fr 0.8fr 2.4rem;
  align-items:center;
  padding:1.1rem 1.5rem;
  border-bottom:1px solid rgba(212,168,83,0.12);
  font-family:'Cormorant Garamond',serif;
}
.board-row:nth-child(odd){background:rgba(212,168,83,0.04);}
.board-row.past{opacity:0.35;}
.row-time{font-size:1.6rem;font-weight:600;color:var(--saffron-light);font-variant-numeric:tabular-nums;}
.row-location{justify-self:start;min-width:3.2rem;padding:0.28rem 0.55rem;border:1px solid rgba(212,168,83,0.45);border-radius:999px;background:rgba(212,168,83,0.1);font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.08em;text-align:center;color:var(--gold-light);}
.row-name{font-size:1.7rem;font-weight:600;letter-spacing:0.02em;}
.row-party{font-size:1.15rem;color:rgba(253,246,233,0.75);}

.empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0.8rem;
  color:rgba(253,246,233,0.5);
  text-align:center;
}
.empty-state span{font-size:2.2rem;}
.empty-state p{font-family:'Cormorant Garamond',serif;font-size:1.6rem;}

.error-banner{
  background:rgba(200,34,10,0.15);
  border:1px solid rgba(200,34,10,0.4);
  color:#F5B0A0;
  padding:0.7rem 1.2rem;
  border-radius:8px;
  font-size:0.85rem;
  margin-bottom:1rem;
  display:none;
}
.error-banner.show{display:block;}

footer{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.7rem;
  text-align:center;
  padding:0.8rem;
  font-size:0.7rem;
  letter-spacing:0.08em;
  color:rgba(253,246,233,0.35);
  border-top:1px solid rgba(212,168,83,0.15);
}
.wake-lock-btn{
  border:1px solid rgba(212,168,83,0.35);
  border-radius:999px;
  background:rgba(212,168,83,0.1);
  color:var(--gold-light);
  padding:0.25rem 0.55rem;
  font:inherit;
  letter-spacing:inherit;
  cursor:pointer;
}
.wake-lock-btn:hover{border-color:var(--gold);}
.wake-lock-btn[hidden]{display:none;}

@media (max-width:900px){
  .row-time{font-size:1.2rem;}
  .row-name{font-size:1.3rem;}
  .row-party{font-size:1rem;}
  .brand-text h1{font-size:1.2rem;}
  #clock{font-size:1.2rem;}
}
@media (max-width:600px){
  header{padding:1rem 0.8rem;gap:0.6rem;}
  .brand{gap:0.55rem;min-width:0;}
  .brand img{width:82px;height:auto;flex-shrink:0;}
  .brand-text{min-width:0;}
  .brand-text h1{font-size:1.05rem;line-height:1.05;}
  .brand-text p{font-size:0.56rem;letter-spacing:0.1em;margin-top:0.25rem;}
  .header-right{flex-shrink:0;}
  #clock{font-size:1.05rem;}
  #dateLine{max-width:88px;font-size:0.57rem;line-height:1.25;letter-spacing:0.07em;}
  .board-toolbar{padding:0.65rem 0.75rem;gap:0.5rem;}
  .location-filters{gap:0.3rem;}
  .filter-label{display:none;}
  .filter-btn{min-width:2.45rem;padding:0.34rem 0.55rem;font-size:0.62rem;}
  .sort-note{font-size:0.52rem;letter-spacing:0.05em;}
  main{padding:1rem 0.75rem 1.25rem;}
  .board-cols,.board-row{
    grid-template-columns:28px 54px 48px minmax(70px,1fr) 44px 28px;
    column-gap:0.65rem;
    padding-left:0.65rem;
    padding-right:0.65rem;
  }
  .board-cols{padding-top:0.7rem;padding-bottom:0.7rem;font-size:0.57rem;letter-spacing:0.08em;}
  .board-cols span{min-width:0;overflow:hidden;white-space:nowrap;}
  .board-row{padding-top:0.9rem;padding-bottom:0.9rem;}
  .row-time{font-size:1rem;white-space:nowrap;}
  .row-location{min-width:0;width:100%;padding:0.24rem 0.25rem;font-size:0.65rem;letter-spacing:0.05em;white-space:nowrap;}
  .row-name{min-width:0;font-size:1.12rem;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-party{font-size:0.78rem;line-height:1.2;white-space:nowrap;}
  footer{font-size:0.58rem;padding:0.65rem;}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="images/logo.png" alt="Vatan">
    <div class="brand-text">
      <h1 id="boardTitle">Today's Reservations</h1>
      <p id="locLabel">Loading…</p>
    </div>
  </div>
  <div class="header-right">
    <div id="clock">--:--</div>
    <div id="dateLine">—</div>
  </div>
</header>

<nav class="board-toolbar" aria-label="Reservation location filters">
  <div class="location-filters">
    <span class="filter-label">Location</span>
    <a class="filter-btn" data-loc="" href="reservations-board.html">All</a>
    <a class="filter-btn" data-loc="jc" href="reservations-board.html?loc=jc">JC</a>
    <a class="filter-btn" data-loc="ew" href="reservations-board.html?loc=ew">EW</a>
    <a class="filter-btn" data-loc="edi" href="reservations-board.html?loc=edi">EDI</a>
  </div>
  <div class="date-group">
    <label class="date-label" for="boardDate">Date</label>
    <input type="date" id="boardDate">
  </div>
  <span class="sort-note">↑ Earliest time first</span>
</nav>

<main>
  <div class="error-banner" id="errorBanner">Couldn't load reservations — retrying…</div>
  <div class="coverage-note" id="coverageNote"></div>

  <div id="boardWrap">
    <div class="board-cols">
      <span>Done</span>
      <span>Time</span>
      <span>Location</span>
      <span>Name</span>
      <span>Party</span>
      <span></span>
    </div>
    <div class="board-body" id="boardBody"></div>
  </div>

  <button class="dismissed-bar" id="dismissedBar" type="button"></button>
  <div class="empty-state" id="emptyState" style="display:none;">
    <span>🍽️</span>
    <p>No reservations for this date</p>
  </div>
</main>

<footer>
  <span>Vatan &mdash; auto-refreshes every 5 min</span>
  <button class="wake-lock-btn" id="wakeLockButton" type="button" hidden>Keep screen on</button>
</footer>

<script>
const params = new URLSearchParams(location.search);
const boardLocationKey = 'vatan-reservations-board-location';
const requestedLoc = params.get('loc');
if (requestedLoc !== null) {
  localStorage.setItem(boardLocationKey, requestedLoc.toLowerCase());
} else if (params.get('app') === '1') {
  const savedLoc = localStorage.getItem(boardLocationKey);
  if (savedLoc) {
    params.set('loc', savedLoc);
    history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
  }
}
const loc = (params.get('loc') || '').toLowerCase();
const locLabel = loc === 'jc' ? 'Jersey City' : loc === 'ew' ? 'East Windsor' : (loc === 'edi' || loc === 'ed') ? 'Edison' : 'All Locations';
document.getElementById('locLabel').textContent = locLabel;
const activeLoc = loc === 'ed' ? 'edi' : loc;
document.querySelectorAll('.filter-btn').forEach((button) => {
  const isActive = button.dataset.loc === activeLoc;
  button.classList.toggle('active', isActive);
  if (isActive) button.setAttribute('aria-current', 'page');
  button.addEventListener('click', (event) => {
    localStorage.setItem(boardLocationKey, button.dataset.loc);
    if (boardDateInput.value && boardDateInput.value !== nyToday()) {
      event.preventDefault();
      const url = new URL(button.href, location.origin);
      url.searchParams.set('date', boardDateInput.value);
      location.href = `${url.pathname}?${url.searchParams.toString()}`;
    }
  });
});

const wakeLockButton = document.getElementById('wakeLockButton');
let screenWakeLock = null;

async function keepScreenAwake() {
  if (!('wakeLock' in navigator)) return;
  try {
    screenWakeLock = await navigator.wakeLock.request('screen');
    wakeLockButton.hidden = true;
    screenWakeLock.addEventListener('release', () => {
      screenWakeLock = null;
    }, { once: true });
  } catch (error) {
    wakeLockButton.hidden = false;
  }
}

wakeLockButton.addEventListener('click', keepScreenAwake);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !screenWakeLock) keepScreenAwake();
});
keepScreenAwake();

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  document.getElementById('dateLine').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 15000);

function currentMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function timeToMinutes(t) {
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((t || '').trim());
  if (!m) return 9999;
  let h = parseInt(m[1], 10) % 12;
  if (/pm/i.test(m[3])) h += 12;
  return h * 60 + parseInt(m[2], 10);
}

async function loadBoard() {
  const errorBanner = document.getElementById('errorBanner');
  try {
    const viewing = viewedDateKey();
    const res = await fetch(`/.netlify/functions/reservations-board?loc=${encodeURIComponent(loc)}&date=${encodeURIComponent(viewing)}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    errorBanner.classList.remove('show');
    renderBoard(data.reservations || [], data.date || viewing);
  } catch (err) {
    errorBanner.classList.add('show');
  }
}

function renderBoard(rows, date) {
  const body = document.getElementById('boardBody');
  const boardWrap = document.getElementById('boardWrap');
  const emptyState = document.getElementById('emptyState');
  const dismissedBar = document.getElementById('dismissedBar');
  const coverageNote = document.getElementById('coverageNote');
  const title = document.getElementById('boardTitle');
  const nowMin = currentMinutes();
  const isToday = date === nyToday();

  title.textContent = isToday ? "Today's Reservations" : `Reservations \u00b7 ${prettyDate(date)}`;
  coverageNote.textContent = 'Showing reservations found in recent submissions.';
  coverageNote.classList.toggle('show', !isToday);

  const visible = rows.filter((r) => !r.dismissed);
  const hiddenCount = rows.length - visible.length;
  if (hiddenCount > 0) {
    dismissedBar.textContent = `${hiddenCount} dismissed \u2014 tap to restore`;
    dismissedBar.classList.add('show');
  } else {
    dismissedBar.classList.remove('show');
  }

  if (!visible.length) {
    boardWrap.style.display = 'none';
    emptyState.style.display = 'flex';
    return;
  }

  boardWrap.style.display = 'flex';
  emptyState.style.display = 'none';

  const sortedRows = [...visible].sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
  body.innerHTML = sortedRows.map((r) => `
    <div class="board-row ${isToday && timeToMinutes(r.time) < nowMin - 90 ? 'past' : ''} ${r.done ? 'done' : ''}" data-id="${escapeHtml(r.id)}">
      <input type="checkbox" class="row-check" aria-label="Mark done" ${r.done ? 'checked' : ''}>
      <span class="row-time">${escapeHtml(r.time)}</span>
      <span class="row-location">${escapeHtml(r.location)}</span>
      <span class="row-name">${escapeHtml(r.name)}</span>
      <span class="row-party">${escapeHtml(r.party)}</span>
      <button type="button" class="row-dismiss" aria-label="Dismiss">\u00d7</button>
    </div>
  `).join('');

  if (!isToday) {
    body.scrollTop = 0;
    return;
  }

  const firstUpcomingIndex = sortedRows.findIndex((row) => timeToMinutes(row.time) >= nowMin);
  const scrollTargetIndex = firstUpcomingIndex === -1
    ? sortedRows.length - 1
    : Math.max(0, firstUpcomingIndex - 1);

  requestAnimationFrame(() => {
    const targetRow = body.querySelectorAll('.board-row')[scrollTargetIndex];
    if (!targetRow) return;
    targetRow.dataset.autoScrollTarget = 'true';
    const targetTop = targetRow.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
    body.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

const boardDateInput = document.getElementById('boardDate');

function nyToday() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
}

function prettyDate(ymd) {
  const parts = (ymd || '').split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function viewedDateKey() {
  return boardDateInput.value || nyToday();
}

(function initBoardDate() {
  const q = new URLSearchParams(location.search).get('date');
  boardDateInput.value = (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) ? q : nyToday();
})();

function syncDateParam() {
  const url = new URL(location.href);
  const viewing = viewedDateKey();
  if (viewing === nyToday()) {
    url.searchParams.delete('date');
  } else {
    url.searchParams.set('date', viewing);
  }
  history.replaceState(null, '', `${url.pathname}?${url.searchParams.toString()}`);
}

boardDateInput.addEventListener('change', () => {
  if (!boardDateInput.value) boardDateInput.value = nyToday();
  syncDateParam();
  loadBoard();
});

async function postMark(id, patch) {
  const res = await fetch('/.netlify/functions/reservations-board', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date: viewedDateKey(), submissionId: id, ...patch }),
  });
  if (!res.ok) throw new Error('save failed');
}

function flashError() {
  const errorBanner = document.getElementById('errorBanner');
  errorBanner.textContent = "Couldn't save \u2014 retrying on next refresh.";
  errorBanner.classList.add('show');
  setTimeout(() => errorBanner.classList.remove('show'), 4000);
}

document.getElementById('boardBody').addEventListener('change', async (event) => {
  const box = event.target.closest('.row-check');
  if (!box) return;
  const row = box.closest('.board-row');
  const id = row && row.dataset.id;
  if (!id) return;
  row.classList.toggle('done', box.checked);
  try {
    await postMark(id, { done: box.checked });
  } catch (err) {
    box.checked = !box.checked;
    row.classList.toggle('done', box.checked);
    flashError();
  }
});

document.getElementById('boardBody').addEventListener('click', async (event) => {
  const btn = event.target.closest('.row-dismiss');
  if (!btn) return;
  const row = btn.closest('.board-row');
  const id = row && row.dataset.id;
  if (!id) return;
  row.style.display = 'none';
  try {
    await postMark(id, { dismissed: true });
    loadBoard();
  } catch (err) {
    row.style.display = '';
    flashError();
  }
});

document.getElementById('dismissedBar').addEventListener('click', async () => {
  const bar = document.getElementById('dismissedBar');
  bar.disabled = true;
  try {
    const res = await fetch(`/.netlify/functions/reservations-board?loc=${encodeURIComponent(loc)}&date=${encodeURIComponent(viewedDateKey())}`, { cache: 'no-store' });
    const data = await res.json();
    const hidden = (data.reservations || []).filter((r) => r.dismissed);
    for (const r of hidden) {
      await postMark(r.id, { dismissed: false });
    }
    loadBoard();
  } catch (err) {
    flashError();
  } finally {
    bar.disabled = false;
  }
});

loadBoard();
setInterval(loadBoard, 300000); // 5 minutes

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/reservation-board-sw.js', { scope: '/reservations-board.html' }).catch(() => {});
  });
}
</script>

</body>
</html>
